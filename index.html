<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spinlink – one link for all your music</title><meta name="theme-color" content="#0E0B14">
<link rel="stylesheet" href="/smartlink.css">
<style>
body{min-height:100svh;background:radial-gradient(900px 500px at 85% -10%,#ff3d8133,transparent),radial-gradient(700px 500px at -10% 110%,#6b4bff2e,transparent),var(--ink)}
a{color:inherit}button,input,select{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(18px,4vw,40px)}
.logo{font:800 22px 'Bricolage Grotesque';letter-spacing:-.04em;display:flex;gap:10px;align-items:center}
.logo:before{content:"";width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,var(--ink) 0 14%,var(--a) 15% 40%,#111 41%);box-shadow:0 0 0 1px #fff3}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;max-width:1100px;margin:0 auto;padding:30px clamp(18px,4vw,40px) 60px}
.hero h1{font:800 clamp(2.6rem,6.5vw,5rem)/.95 'Bricolage Grotesque';letter-spacing:-.045em;text-align:left;text-wrap:balance}
.hero p.lead{margin:20px 0 28px;font-size:18px;opacity:.7;max-width:46ch}
.auth{display:grid;gap:10px;max-width:380px}
input,select{background:#ffffff10;border:1px solid #ffffff24;border-radius:12px;padding:12px 14px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--a)}select option{color:#000}
.pri{background:var(--bone);color:var(--ink);border:0;border-radius:99px;padding:13px 22px;font-weight:700;cursor:pointer}
.pri:hover{background:#fff}.ghost{background:none;border:1px solid #ffffff30;border-radius:99px;padding:10px 16px;cursor:pointer}.ghost:hover{background:#ffffff12}
.link{background:none;border:0;opacity:.6;text-decoration:underline;cursor:pointer;justify-self:start}
.phone{width:min(100%,330px);aspect-ratio:9/18;border-radius:42px;border:8px solid #1c1726;box-shadow:0 0 0 1px #ffffff26,0 50px 100px -30px #ff3d8199;overflow:hidden;background:var(--ink);justify-self:center;display:block}
.phone iframe{width:100%;height:100%;border:0}
.dash{display:grid;grid-template-columns:270px minmax(0,1fr) 340px;gap:22px;padding:0 clamp(18px,4vw,40px) 40px;max-width:1500px;margin:0 auto}
.panel{background:#ffffff0c;border:1px solid #ffffff1c;border-radius:22px;padding:18px}
.item{display:grid;gap:4px;padding:12px;border-radius:14px;cursor:pointer;border:1px solid transparent}
.item:hover{background:#ffffff0e}.item.on{background:#ffffff16;border-color:#ffffff2a}
.item small{opacity:.6}.item b{font-weight:700}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;font-size:13px;opacity:.9;margin-bottom:12px}
label input[type=color]{padding:3px;height:44px}.pr{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;margin-bottom:8px}
.pr button{background:#ffffff10;border:0;border-radius:12px;cursor:pointer}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.stats{display:flex;gap:26px;margin-bottom:18px}.stats div{font:800 34px 'Bricolage Grotesque';letter-spacing:-.04em}.stats small{display:block;font:500 12px 'DM Sans';opacity:.6;letter-spacing:0}
h2{font:800 20px 'Bricolage Grotesque';letter-spacing:-.02em;margin-bottom:14px}
#toast{position:fixed;bottom:24px;left:50%;translate:-50% 0;background:var(--bone);color:var(--ink);padding:11px 20px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}#toast.on{opacity:1}
.hint{opacity:.6;font-size:14px}
@media(max-width:1100px){.dash{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.phone{max-width:300px}}
</style></head><body>
<header class="top"><div class="logo">Spinlink</div><div id="nav"></div></header>
<div id="app"></div><div id="toast"></div>
<script src="/config.js"></script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
import {card,esc,PLATFORMS} from '/render.js';
const sb=createClient(CFG.url,CFG.key),$=s=>document.querySelector(s);
let user,links=[],stats={},cur=null,mode='in';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
const doc=l=>`<!doctype html><link rel=stylesheet href=/smartlink.css><base target=_blank><body>${card(l)}`;
const sample={title:'Midnight Static',artist:'Nova Reyes',accent:'#FF3D81',links:[{platform:'spotify',url:'#'},{platform:'apple',url:'#'},{platform:'youtube',url:'#'},{platform:'soundcloud',url:'#'}]};
sb.auth.onAuthStateChange((_,s)=>{user=s?.user;user?dash():landing()});
function landing(){
 $('#nav').innerHTML='';
 $('#app').innerHTML=`<section class=hero><div><h1>One link for every place your music lives.</h1>
 <p class=lead>Build a smartlink for your next release in a minute. Your cover art sets the mood, and you see who clicked what.</p>
 <form class=auth id=af><input name=email type=email placeholder="Email" required autocomplete=email><input name=pw type=password placeholder="Password (6+ characters)" minlength=6 required>
 <button class=pri>${mode=='in'?'Sign in':'Create your account'}</button><button type=button class=link id=sw>${mode=='in'?'New here? Create an account':'Have an account? Sign in'}</button></form></div>
 <div class=phone><iframe title="Example smartlink" srcdoc="${esc(doc(sample))}"></iframe></div></section>`;
 $('#sw').onclick=()=>{mode=mode=='in'?'up':'in';landing()};
 $('#af').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),c={email:f.get('email'),password:f.get('pw')};
  const {error,data}=mode=='in'?await sb.auth.signInWithPassword(c):await sb.auth.signUp(c);
  if(error)toast(error.message);else if(mode=='up'&&!data.session)toast('Check your email to confirm your account')};
}
async function load(){
 const [a,b]=await Promise.all([sb.from('smartlinks').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),
  sb.from('events').select('link_id,type').gte('created_at',new Date(Date.now()-30*864e5).toISOString()).limit(10000)]);
 links=a.data||[];stats={};(b.data||[]).forEach(e=>{const s=stats[e.link_id]??={view:0,click:0};s[e.type]++});
}
async function dash(){
 $('#nav').innerHTML=`<button class=ghost id=out>Sign out</button>`;$('#out').onclick=()=>sb.auth.signOut();
 await load();cur??=links[0]||null;paint();
}
function paint(){
 const tot=links.reduce((n,l)=>({v:n.v+(stats[l.id]?.view||0),c:n.c+(stats[l.id]?.click||0)}),{v:0,c:0});
 $('#app').innerHTML=`<div class=dash><aside class=panel><div class=stats><div>${tot.v}<small>views, 30 days</small></div><div>${tot.c}<small>clicks</small></div></div>
 <button class=pri id=new style="width:100%;margin-bottom:12px">New smartlink</button>
 ${links.map(l=>`<div class="item ${cur?.id==l.id?'on':''}" data-id="${l.id}"><b>${esc(l.title)}</b><small>${esc(l.artist)} · ${stats[l.id]?.view||0} views · ${stats[l.id]?.click||0} clicks</small></div>`).join('')||'<p class=hint>No smartlinks yet. Create your first one.</p>'}</aside>
 <section class=panel id=ed></section><div><div class=phone><iframe id=pv title="Live preview"></iframe></div></div></div>`;
 $('#new').onclick=()=>{cur={title:'',artist:'',slug:'',accent:'#FF3D81',cover_url:'',links:[{platform:'spotify',url:''}],published:true};paint();};
 document.querySelectorAll('.item').forEach(i=>i.onclick=()=>{cur=links.find(l=>l.id==i.dataset.id);paint()});
 editor();
}
const opts=v=>Object.entries(PLATFORMS).map(([k,[n]])=>`<option value=${k} ${k==v?'selected':''}>${n}</option>`).join('');
const prev=()=>{const f=$('#pv');if(f)f.srcdoc=doc(cur)};
function editor(){
 const ed=$('#ed');if(!cur){ed.innerHTML='<h2>Create a smartlink</h2><p class=hint>Pick “New smartlink” to add your release.</p>';prev();return}
 const l=cur,url=`${location.origin}/l/${l.slug}`;
 ed.innerHTML=`<h2>${l.id?'Edit smartlink':'New smartlink'}</h2>
 <div class=f><label>Release title<input data-k=title value="${esc(l.title)}"></label><label>Artist<input data-k=artist value="${esc(l.artist)}"></label></div>
 <div class=f><label>Link name (${location.host}/l/…)<input data-k=slug value="${esc(l.slug)}" placeholder="midnight-static"></label>
 <label>Accent color<input type=color data-k=accent value="${l.accent}"></label></div>
 <label>Cover art<input type=file id=cv accept="image/*"></label>
 <h2 style="margin-top:8px">Where to listen</h2>
 ${l.links.map((x,i)=>`<div class=pr><select data-i=${i} data-k=platform>${opts(x.platform)}</select><input data-i=${i} data-k=url value="${esc(x.url)}" placeholder="https://open.spotify.com/…"><button data-rm=${i} aria-label="Remove">×</button></div>`).join('')}
 <button class=ghost id=add>Add platform</button>
 <div class=bar><button class=pri id=save>${l.id?'Save changes':'Publish smartlink'}</button>${l.id?`<button class=ghost id=copy>Copy link</button><a class=ghost href="${url}" target=_blank style="text-decoration:none">Open page</a><button class=ghost id=del>Delete</button>`:''}</div>`;
 ed.oninput=e=>{const t=e.target,k=t.dataset.k;if(!k)return;
  if(t.dataset.i!=null)cur.links[t.dataset.i][k]=t.value;else cur[k]=k=='slug'?t.value.toLowerCase().replace(/[^a-z0-9-]/g,'-'):t.value;prev()};
 ed.onclick=e=>{const t=e.target;if(t.dataset.rm!=null){cur.links.splice(t.dataset.rm,1);editor()}};
 $('#add').onclick=()=>{cur.links.push({platform:'apple',url:''});editor()};
 $('#cv').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  const p=`${user.id}/${Date.now()}-${f.name.replace(/[^\w.-]/g,'')}`,{error}=await sb.storage.from('covers').upload(p,f);
  if(error)return toast(error.message);cur.cover_url=sb.storage.from('covers').getPublicUrl(p).data.publicUrl;prev();toast('Cover uploaded')};
 $('#save').onclick=async()=>{const{id,created_at,user_id,...row}=cur;row.links=row.links.filter(x=>x.url);
  if(!row.title||!row.artist||!row.slug)return toast('Add a title, artist and link name');
  const q=id?sb.from('smartlinks').update(row).eq('id',id):sb.from('smartlinks').insert(row);
  const{data,error}=await q.select().single();
  if(error)return toast(error.code=='23505'?'That link name is taken. Try another.':error.message);
  cur=data;await load();paint();toast(id?'Saved':'Published')};
 if(l.id){$('#copy').onclick=()=>navigator.clipboard.writeText(url).then(()=>toast('Link copied'));
  $('#del').onclick=async()=>{if(!confirm('Delete this smartlink and its stats?'))return;await sb.from('smartlinks').delete().eq('id',l.id);cur=null;await load();paint()}}
 prev();
}
</script></body></html>
